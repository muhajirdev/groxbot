# Unused. Default local catalog is wrangler D1 (`pnpm db:migrate`).
# Node self-host uses DATABASE_PATH (sqlite file), not this container.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: groxbot
      POSTGRES_PASSWORD: groxbot
      POSTGRES_DB: groxbot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groxbot"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
