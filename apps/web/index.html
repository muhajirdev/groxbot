<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Groxbot</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #000;
        color: #fff;
      }
      html[data-theme="light"],
      html[data-theme="light"] body,
      html[data-theme="light"] #root {
        background: #f6f6f6;
        color: #111;
      }
    </style>
    <script>
      try {
        var color = localStorage.getItem("groxbot.officeColor") || "";
        var theme = localStorage.getItem("groxbot.theme");
        var map = {
          night: ["night", "dark"],
          dusk: ["dusk", "dark"],
          paper: ["paper", "light"],
          blush: ["blush", "light"],
          clay: ["dusk", "dark"],
          umber: ["night", "dark"],
          moss: ["night", "dark"],
          teal: ["night", "dark"],
          dust: ["paper", "light"],
          bone: ["paper", "light"],
          sage: ["paper", "light"],
          mist: ["paper", "light"],
        };
        var pair = map[color];
        var lightPref =
          theme === "light" ||
          (theme === "system" &&
            matchMedia("(prefers-color-scheme: light)").matches);
        if (pair) {
          document.documentElement.dataset.officeColor = pair[0];
          document.documentElement.dataset.theme = pair[1];
        } else {
          document.documentElement.dataset.theme = lightPref ? "light" : "dark";
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=optional"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=optional"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
