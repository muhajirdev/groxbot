<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Groxbot</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #0d0d0e;
        color: #f7f8f8;
      }
      html[data-theme="light"],
      html[data-theme="light"] body,
      html[data-theme="light"] #root {
        background: #f2f1ed;
        color: #22211f;
      }
      html[data-office-color="snow"],
      html[data-office-color="snow"] body,
      html[data-office-color="snow"] #root {
        background: #f2f1ed;
        color: #22211f;
      }
      html[data-office-color="paper"],
      html[data-office-color="paper"] body,
      html[data-office-color="paper"] #root {
        background: #d4c4ae;
        color: #2a2118;
      }
      html[data-office-color="blush"],
      html[data-office-color="blush"] body,
      html[data-office-color="blush"] #root {
        background: #e89ab4;
        color: #4a1830;
      }
      html[data-office-color="night"],
      html[data-office-color="night"] body,
      html[data-office-color="night"] #root {
        background: #060a18;
        color: #e6eefc;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .boot-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .boot-faces {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-face {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        margin-left: -10px;
      }
      .boot-face:first-child {
        margin-left: 0;
      }
      .boot-face svg {
        display: block;
        width: 32px;
        height: 32px;
        overflow: visible;
      }
      .boot-word {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
    </style>
    <script>
      try {
        var color = localStorage.getItem("groxbot.officeColor") || "";
        var theme = localStorage.getItem("groxbot.theme");
        var map = {
          linear: ["linear", "dark"],
          night: ["night", "dark"],
          snow: ["snow", "light"],
          paper: ["paper", "light"],
          blush: ["blush", "light"],
          dusk: ["linear", "dark"],
          clay: ["linear", "dark"],
          charcoal: ["linear", "dark"],
          umber: ["night", "dark"],
          moss: ["night", "dark"],
          teal: ["night", "dark"],
          panic: ["night", "dark"],
          nord: ["night", "dark"],
          graphite: ["snow", "light"],
          dust: ["paper", "light"],
          bone: ["paper", "light"],
          sage: ["paper", "light"],
          mist: ["paper", "light"],
        };
        var pair = map[color];
        var office = pair ? pair[0] : "";
        var lookTheme = pair ? pair[1] : "";
        var systemLight = matchMedia("(prefers-color-scheme: light)").matches;
        var appearance =
          theme === "light"
            ? "light"
            : theme === "dark"
              ? "dark"
              : theme === "system"
                ? systemLight
                  ? "light"
                  : "dark"
                : lookTheme || "dark";
        if (!office) {
          office = appearance === "light" ? "snow" : "linear";
        } else if (
          theme === "light" ||
          theme === "dark" ||
          theme === "system"
        ) {
          var pinned = lookTheme === appearance;
          if (!pinned) office = appearance === "light" ? "snow" : "linear";
        }
        var scheme = {
          snow: "light",
          paper: "light",
          blush: "light",
          linear: "dark",
          night: "dark",
        };
        document.documentElement.dataset.officeColor = office;
        document.documentElement.dataset.theme = scheme[office] || appearance;
      } catch (e) {}
    </script>
